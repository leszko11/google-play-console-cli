name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: test-and-build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Lint
        run: go vet ./...

      - name: Command docs sync
        run: make check-command-docs

      - name: Run tests
        run: go test ./...

      - name: Build
        run: |
          VERSION="dev"
          COMMIT="${GITHUB_SHA::7}"
          DATE="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          LDFLAGS="-X 'github.com/leszko11/google-play-console-cli/cmd.Version=${VERSION}' -X 'github.com/leszko11/google-play-console-cli/cmd.Commit=${COMMIT}' -X 'github.com/leszko11/google-play-console-cli/cmd.Date=${DATE}'"
          go build -ldflags "$LDFLAGS" ./...
