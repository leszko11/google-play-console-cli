name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: test-and-build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Lint
        run: go vet ./...

      - name: Command docs sync
        env:
          GPC_BIN: ""
        run: make check-command-docs

      - name: OpenAPI coverage sync
        run: make check-openapi-coverage

      - name: OpenAPI discovery drift
        run: make check-openapi-drift

      - name: Run tests
        run: go test ./...

      - name: Build
        run: |
          VERSION="dev"
          COMMIT="${GITHUB_SHA::7}"
          DATE="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          LDFLAGS="-X 'github.com/leszko11/google-play-console-cli/cmd.Version=${VERSION}' -X 'github.com/leszko11/google-play-console-cli/cmd.Commit=${COMMIT}' -X 'github.com/leszko11/google-play-console-cli/cmd.Date=${DATE}'"
          go build -ldflags "$LDFLAGS" ./...

  coverage:
    name: coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run coverage
        run: |
          go test -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tee coverage.txt
          awk '/^total:/ { gsub("%", "", $3); if ($3 + 0 < 20) { exit 1 } }' coverage.txt

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.out
            coverage.txt

  benchmarks:
    name: benchmarks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run benchmarks
        run: go test -run=^$ -bench=. -benchmem ./internal/cli/shared ./internal/cli/listing ./internal/cli/release

  release-config:
    name: release-config
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          install-only: true

      - name: Validate GoReleaser config
        run: goreleaser check

      - name: Build snapshot release
        run: goreleaser release --snapshot --clean
