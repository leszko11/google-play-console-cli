name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  build-release-artifacts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify tests
        run: go test ./...

      - name: Build
        run: |
          GOOS=linux GOARCH=amd64 go build -o dist/gpc-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -o dist/gpc-linux-arm64 .
          GOOS=darwin GOARCH=amd64 go build -o dist/gpc-darwin-amd64 .
          GOOS=darwin GOARCH=arm64 go build -o dist/gpc-darwin-arm64 .
          GOOS=windows GOARCH=amd64 go build -o dist/gpc-windows-amd64.exe .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gpc-release-builds
          path: dist/*
